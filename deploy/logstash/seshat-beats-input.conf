# Seshat -> Logstash -> Elasticsearch / OpenSearch
#
# Seshat's Logstash destination speaks the Beats (lumberjack v2) protocol and sends ECS JSON
# documents that already carry data_stream.type / .dataset / .namespace. This pipeline
#   1. accepts them on the Beats input (5044),
#   2. fills the data_stream fields if a sender left them out,
#   3. routes on [event][dataset] into logs-<dataset>-<namespace> data streams,
#   4. tags events whose dataset is not one of the six Seshat datasets (they are still delivered).
#
# Copy to /etc/logstash/conf.d/ (or mount it into the container's /usr/share/logstash/pipeline/).
# Secrets and addresses come from the Logstash keystore or environment: ${VAR} and ${VAR:default}.
# Needs the index templates from deploy/elasticsearch or deploy/opensearch installed first.

input {
  beats {
    port => 5044

    # Seshat emits ECS field names; use the ECS-compatible plugin metadata layout.
    ecs_compatibility => v8

    # TLS (recommended). Uncomment and point at your own files. With client authentication on,
    # Seshat's destination must present a certificate signed by the CA below.
    # ssl_enabled => true
    # ssl_certificate => "/etc/logstash/tls/server.crt"
    # ssl_key => "/etc/logstash/tls/server.pkcs8.key"             # PKCS#8 PEM
    # ssl_certificate_authorities => ["/etc/logstash/tls/ca.crt"]
    # ssl_client_authentication => "required"                    # none | optional | required
  }
}

filter {
  # --- 1. Make the routing fields present (Seshat sets them; other senders may not) -----------
  if ![data_stream][type] {
    mutate { add_field => { "[data_stream][type]" => "logs" } }
  }
  if ![data_stream][dataset] and [event][dataset] {
    mutate { copy => { "[event][dataset]" => "[data_stream][dataset]" } }
  }
  if ![data_stream][namespace] {
    # Fallback only. Seshat always sets the namespace from the organisation short name.
    mutate { add_field => { "[data_stream][namespace]" => "${SESHAT_DEFAULT_NAMESPACE:default}" } }
  }

  # --- 2. Flag datasets this schema version does not define ---------------------------------
  # They are still delivered (nothing is dropped); the tag lets you find them. To keep them out of
  # your Seshat streams, send tagged events to a different output with
  #   if "seshat_unknown_dataset" in [tags] { ... } in the output section.
  if [event][dataset] not in ["seshat.trap", "seshat.syslog", "seshat.flow", "seshat.flow_rollup", "seshat.tracker", "seshat.device", "seshat.metric"] {
    mutate { add_tag => ["seshat_unknown_dataset"] }
  }

  # --- 3. Optional: stamp the ingest time here instead of in an ingest pipeline --------------
  # ruby { code => 'event.set("[event][ingested]", Time.now.utc.strftime("%Y-%m-%dT%H:%M:%S.%LZ"))' }
}

output {
  # Exactly one of the two outputs below should be active. Elasticsearch is active by default.

  # ----------------------------------------------------------------------------------------
  # Elasticsearch (logstash-output-elasticsearch, bundled with Logstash)
  # data_stream => true reads [data_stream][type|dataset|namespace] from each event, so the
  # event goes to logs-<dataset>-<namespace> with the create action that data streams require.
  # ----------------------------------------------------------------------------------------
  elasticsearch {
    hosts => ["${ELASTICSEARCH_URL:https://elasticsearch.example.com:9200}"]
    data_stream => true
    data_stream_auto_routing => true
    api_key => "${ELASTICSEARCH_API_KEY}"                       # "<id>:<api_key>"; or use user/password
    # user => "${ELASTICSEARCH_USER}"
    # password => "${ELASTICSEARCH_PASSWORD}"
    ssl_enabled => true
    ssl_certificate_authorities => ["/etc/logstash/tls/es-ca.crt"]
  }

  # ----------------------------------------------------------------------------------------
  # OpenSearch (logstash-output-opensearch; install it first:
  #   bin/logstash-plugin install logstash-output-opensearch
  # or use the opensearchproject/logstash-oss-with-opensearch-output-plugin image).
  # Comment out the elasticsearch block above and enable this one.
  # ----------------------------------------------------------------------------------------
  # opensearch {
  #   hosts => ["${OPENSEARCH_URL:https://opensearch.example.com:9200}"]
  #   action => "create"                                           # data streams accept only create
  #   index => "%{[data_stream][type]}-%{[data_stream][dataset]}-%{[data_stream][namespace]}"
  #   user => "${OPENSEARCH_USER}"
  #   password => "${OPENSEARCH_PASSWORD}"
  #   ssl => true
  #   cacert => "/etc/logstash/tls/os-ca.crt"
  #   ecs_compatibility => disabled                                # no template management from Logstash
  #   manage_template => false
  # }

  # Debugging: print what would be sent (remove in production).
  # stdout { codec => rubydebug }
}
