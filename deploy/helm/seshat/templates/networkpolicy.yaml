{{- if and .Values.cluster.enabled .Values.cluster.networkPolicy.enabled }}
{{- /* Adds to a default-deny setup: the replicas reach each other on the API port, which carries the peer protocol. */}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "seshat.fullname" . }}-peers
  labels:
    {{- include "seshat.labels" . | nindent 4 }}
    app.kubernetes.io/component: collector
spec:
  podSelector:
    matchLabels:
      {{- include "seshat.selector" (list . "collector") | nindent 6 }}
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "seshat.selector" (list . "collector") | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.ui.containerPort }}}
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "seshat.selector" (list . "collector") | nindent 14 }}
      ports:
        - {protocol: TCP, port: {{ .Values.ui.containerPort }}}
{{- end }}
