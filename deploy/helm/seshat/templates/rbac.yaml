{{- if and (eq .Values.leaderElection.mode "k8s-lease") .Values.serviceAccount.create }}
{{- $lease := default (printf "%s-leader" (include "seshat.fullname" .)) .Values.leaderElection.leaseName }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "seshat.fullname" . }}-leader
  labels:
    {{- include "seshat.labels" . | nindent 4 }}
rules:
  # create cannot be limited by name; get and update are limited to this release's Lease.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["create"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    resourceNames: [{{ $lease | quote }}]
    verbs: ["get", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "seshat.fullname" . }}-leader
  labels:
    {{- include "seshat.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "seshat.fullname" . }}-leader
subjects:
  - kind: ServiceAccount
    name: {{ include "seshat.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
