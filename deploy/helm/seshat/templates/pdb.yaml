{{- if .Values.pdb.enabled }}
{{- if gt (int .Values.replicaCount) 1 }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "seshat.fullname" . }}
  labels:
    {{- include "seshat.labels" . | nindent 4 }}
spec:
  {{- if .Values.pdb.minAvailable }}
  minAvailable: {{ .Values.pdb.minAvailable }}
  {{- else }}
  maxUnavailable: {{ .Values.pdb.maxUnavailable }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "seshat.selector" (list . "collector") | nindent 6 }}
{{- end }}
{{- if and .Values.roles.split (gt (int .Values.console.replicaCount) 1) }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "seshat.fullname" . }}-console
  labels:
    {{- include "seshat.labels" . | nindent 4 }}
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      {{- include "seshat.selector" (list . "console") | nindent 6 }}
{{- end }}
{{- end }}
