{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "seshat.serviceAccountName" . }}
  labels:
    {{- include "seshat.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Only the Lease elector talks to the API server; everything else runs without a token.
automountServiceAccountToken: {{ eq .Values.leaderElection.mode "k8s-lease" }}
{{- end }}
