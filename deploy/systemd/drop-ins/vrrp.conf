# HA modes 1 and 2 (VRRP, docs/ha.md): programming the virtual address needs CAP_NET_ADMIN, the
# advertisements (IP protocol 112) and gratuitous ARP need CAP_NET_RAW and an AF_PACKET socket.
# Install:
#   install -D -m 0644 /usr/share/seshat/systemd/drop-ins/vrrp.conf /etc/systemd/system/seshat.service.d/vrrp.conf
#   systemctl daemon-reload && systemctl restart seshat
# These lines add to the unit's own lists; they do not replace them.
[Service]
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW
RestrictAddressFamilies=AF_PACKET
# A killed process cannot remove its virtual address. Remove it on every stop (a missing address is
# not an error); one line per virtual address, with your address and interface:
#ExecStopPost=-/usr/sbin/ip addr del 192.0.2.100/32 dev eth0
