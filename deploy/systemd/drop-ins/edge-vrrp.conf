# VRRP on an edge collector (docs/edge.md, "VRRP on the edges of a group"): programming the shared address needs
# CAP_NET_ADMIN and a netlink socket, the advertisements (IP protocol 112) need CAP_NET_RAW, and the gratuitous ARP an
# AF_PACKET socket. Without this drop-in the edge runs everything else as usual and reports exactly what VRRP lacks.
# The edge unit allows neither AF_NETLINK nor AF_PACKET, so both are added here (the server's vrrp.conf adds only
# AF_PACKET because the server unit allows AF_NETLINK already).
# Install:
#   install -D -m 0644 /usr/share/seshat-edge/systemd/drop-ins/edge-vrrp.conf /etc/systemd/system/seshat-edge.service.d/edge-vrrp.conf
#   systemctl daemon-reload && systemctl restart seshat-edge
# These lines add to the unit's own lists; they do not replace them.
[Service]
AmbientCapabilities=CAP_NET_ADMIN CAP_NET_RAW
CapabilityBoundingSet=CAP_NET_ADMIN CAP_NET_RAW
RestrictAddressFamilies=AF_NETLINK AF_PACKET
# A killed process cannot remove its virtual address. Remove it on every stop (a missing address is not an
# error); one line per virtual address, with your address and the interface of the edge's network:
#ExecStopPost=-/usr/sbin/ip addr del 192.0.2.100/32 dev eth0
