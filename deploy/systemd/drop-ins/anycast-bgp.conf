# HA mode 3 (anycast with BGP and ECMP, docs/ha.md): adding the service addresses to the loopback and
# setting the TCP-MD5 key of a session need CAP_NET_ADMIN. CAP_NET_RAW is not needed. Listening on
# port 179 for router-initiated sessions uses CAP_NET_BIND_SERVICE, which the unit already has.
# Not needed when you provision the addresses yourself and set program_addresses to false, and use no
# session password.
# Install:
#   install -D -m 0644 /usr/share/seshat/systemd/drop-ins/anycast-bgp.conf /etc/systemd/system/seshat.service.d/anycast-bgp.conf
#   systemctl daemon-reload && systemctl restart seshat
[Service]
AmbientCapabilities=CAP_NET_ADMIN
CapabilityBoundingSet=CAP_NET_ADMIN
