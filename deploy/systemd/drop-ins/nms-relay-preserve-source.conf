# Raw relay with "preserve_source": true (docs/outputs.md, NMS forwarding mode 1): each datagram is
# re-sent from the original device's address through a raw socket, which needs CAP_NET_RAW. Without
# it that destination reports itself blocked (seshat_output_blocked) and keeps its events queued.
# Works for the server and for an edge collector:
#   install -D -m 0644 /usr/share/seshat/systemd/drop-ins/nms-relay-preserve-source.conf /etc/systemd/system/seshat.service.d/nms-relay-preserve-source.conf
#   install -D -m 0644 /usr/share/seshat-edge/systemd/drop-ins/nms-relay-preserve-source.conf /etc/systemd/system/seshat-edge.service.d/nms-relay-preserve-source.conf
#   systemctl daemon-reload && systemctl restart seshat     # or seshat-edge
[Service]
AmbientCapabilities=CAP_NET_RAW
CapabilityBoundingSet=CAP_NET_RAW
